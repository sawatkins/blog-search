readme = "README.md"
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "boto3>=1.37.13",
    "python-dotenv>=1.2.3,<2",
    "fastapi>=0.141.1,<1",
    "fastfeedparser>=0.6.1,<0.7",
    "elasticsearch>=9.3.0,<9.4",
    "jinja2>=3.1.6",
    "lxml>=6.1.3,<7",
    "psycopg2-binary>=2.9.12,<3",
    "protego>=0.6.2,<0.7",
    "python-multipart>=0.0.32,<0.1",
    "requests>=2.34.2,<3",
    "regex>=2026.9.3",
    "trafilatura>=2.2.0,<2.3",
    "urllib3>=2.7.0,<3",
    "uvicorn>=0.52.4,<1",
